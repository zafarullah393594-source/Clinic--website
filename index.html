<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Ali Clinic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #a8e6cf, #dcedc1);
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #2e7d32;
      margin-bottom: 5px;
    }
    p {
      color: #333;
    }
    .btn {
      background-color: #2e7d32;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    .btn:hover {
      background-color: #1b5e20;
    }
    .form-box {
      background: white;
      padding: 25px;
      margin: 30px auto;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 300px;
    }
    input {
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 90%;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Dr. Ali Clinic</h1>
  <p>Bio students ke liye best clinic 🏥</p>
  
  <button class="btn">Appointment Book Karein</button>
  
  <p><b>Contact:</b> 0300-1234567</p>
  <p><b>Address:</b> Main Gulberg, Lahore</p>

  <div class="form-box">
    <h2>Appointment Book Karein</h2>
    <form>
      <input type="text" placeholder="Apna Naam" required><br>
      <input type="tel" placeholder="Phone Number" required><br>
      <button class="btn" type="submit">Send</button>
    </form>
  </div>
</body>
</html>
